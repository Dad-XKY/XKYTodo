<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>马克待办</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; font-family: Arial, "Microsoft YaHei", sans-serif; color: #111; }
    main { width: min(800px, calc(100% - 32px)); margin: 75px auto; padding: 32px 36px; background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, .08); }
    h1 { margin: 0 0 28px; font-size: 40px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
    input[type="text"] { flex: 1 1 300px; min-width: 0; padding: 12px 15px; font-size: 20px; }
    .deadline-field { display: flex; align-items: center; gap: 8px; font-size: 16px; }
    input[type="datetime-local"] { max-width: 100%; padding: 11px; font: inherit; }
    button { padding: 12px 20px; font-size: 18px; cursor: pointer; }
    .sort-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; min-height: 84px; border-bottom: 1px solid #eee; font-size: 20px; }
    li input { width: 17px; height: 17px; cursor: pointer; }
    .todo-content { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .deadline { display: block; margin-top: 5px; color: #777; font-size: 14px; }
    .deadline.overdue { color: #c5221f; font-weight: bold; }
    li.done .todo-text { color: #888; text-decoration: line-through; }
    @media (max-width: 480px) { main { margin: 32px auto; padding: 24px; } h1 { font-size: 32px; } li, input[type="text"] { font-size: 16px; } button { padding: 10px 14px; font-size: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>马克待办</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="输入一个待办事项" aria-label="待办事项" autocomplete="off">
      <label class="deadline-field" for="deadline-input">截止时间 <input id="deadline-input" type="datetime-local"></label>
      <button type="submit">添加</button>
    </form>
    <div class="sort-bar"><button id="sort-button" type="button">按截止时间排序</button></div>
    <ul id="todo-list" aria-label="待办事项列表"></ul>
  </main>
  <script>
    const storageKey = 'mark-todos';
    const initialTodos = [
      { text: '关注「马克的技术工作坊」', done: false },
      { text: '给这期 Git 教程点赞', done: true }
    ];
    let todos;
    try {
      const saved = localStorage.getItem(storageKey);
      const parsed = saved === null ? initialTodos : JSON.parse(saved);
      todos = Array.isArray(parsed) ? parsed : initialTodos;
    } catch { todos = initialTodos; }
    const list = document.getElementById('todo-list');
    const input = document.getElementById('todo-input');
    const deadlineInput = document.getElementById('deadline-input');
    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(todos)); } catch { /* 页面仍可在当前会话使用 */ }
    }
    function render() {
      list.replaceChildren();
      todos.forEach((todo, index) => {
        const item = document.createElement('li');
        item.classList.toggle('done', todo.done);
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', `标记完成：${todo.text}`);
        checkbox.addEventListener('change', () => { todo.done = checkbox.checked; save(); render(); });
        const content = document.createElement('div');
        content.className = 'todo-content';
        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;
        content.append(text);
        if (todo.deadline) {
          const deadline = document.createElement('time');
          deadline.className = 'deadline';
          deadline.dateTime = todo.deadline;
          const overdue = !todo.done && new Date(todo.deadline).getTime() <= Date.now();
          deadline.classList.toggle('overdue', overdue);
          deadline.textContent = `${overdue ? '已过期 · ' : ''}截止时间：${todo.deadline.replace('T', ' ')}`;
          content.append(deadline);
        }
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '删除';
        remove.setAttribute('aria-label', `删除：${todo.text}`);
        remove.addEventListener('click', () => { todos.splice(index, 1); save(); render(); });
        item.append(checkbox, content, remove);
        list.append(item);
      });
    }
    document.getElementById('todo-form').addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      todos.push({ text, done: false, deadline: deadlineInput.value });
      input.value = '';
      deadlineInput.value = '';
      save();
      render();
      input.focus();
    });
    document.getElementById('sort-button').addEventListener('click', () => {
      todos.sort((a, b) => {
        const aTime = a.deadline ? new Date(a.deadline).getTime() : Infinity;
        const bTime = b.deadline ? new Date(b.deadline).getTime() : Infinity;
        return aTime === bTime ? 0 : aTime - bTime;
      });
      save();
      render();
    });
    render();
    // 页面保持打开时，定期更新到期状态。
    setInterval(render, 30000);
  </script>
</body>
</html>
